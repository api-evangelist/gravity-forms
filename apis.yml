modified: '2026-05-11'
specificationVersion: '0.19'
apis:
  - aid: gravity-forms:rest-api-v2
    name: Gravity Forms REST API v2
    description: >-
      WordPress-hosted REST API for managing Gravity Forms forms, entries,
      feeds, fields, notifications, submissions, and results. Uses Basic
      Auth or OAuth 1.0a with consumer keys generated in the Gravity Forms
      REST API settings page of the WordPress admin.
    humanURL: https://docs.gravityforms.com/rest-api-v2/
    baseURL: https://your-wordpress-site.example/wp-json/gf/v2
    tags:
      - WordPress
      - Forms
      - Entries
      - Feeds
      - Notifications
      - Submissions
    properties:
