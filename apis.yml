aid: gravity-forms
name: Gravity Forms
description: >-
  Gravity Forms is a premium WordPress form plugin used to build advanced
  forms, surveys, quizzes, payment forms, and workflow applications on
  WordPress sites. The plugin provides drag-and-drop form building,
  conditional logic, add-on integrations with CRMs and marketing platforms,
  and entry management. The Gravity Forms REST API v2 exposes forms,
  entries, feeds, notifications, and submissions over HTTP using Basic
  Auth or OAuth 1.0a authentication scoped to API keys.
type: Index
image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
tags:
  - WordPress
  - Forms
  - Form Builder
  - Surveys
  - Workflow
  - Plugins
